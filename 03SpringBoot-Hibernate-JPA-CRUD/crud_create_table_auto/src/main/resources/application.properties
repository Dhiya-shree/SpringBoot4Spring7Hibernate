spring.application.name=crud_create_table_auto

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/spring
spring.datasource.username=shree
spring.datasource.password=shree

logging.level.root=warn

#Add logging configs to display SQL statements 
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

#Configure JPA/Hibernate to auto createthe table 
# "update" - keep existing data in the table 
# "create" - create new DB , drop old DB 
# "create-drop" - drop old DB and create new when application shuts down (sessionFactory closes)
# "validate" - validate columns , tables - no changes 
# "none" - no changes 
spring.jpa.hibernate.ddl-auto=update
